name: Publicar no Instagram

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      teste:
        description: "So simular (nao publica nada)"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Publicar posts com horario vencido
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          DRY_RUN: ${{ inputs.teste && '1' || '' }}
          AVISO_ARQUIVO: ${{ runner.temp }}/aviso.md
        run: python3 publicacao/publicar.py

      - name: Avisar por e-mail (comentario na issue #4)
        if: always() && !inputs.teste
        env:
          GH_TOKEN: ${{ github.token }}
          AVISO: ${{ runner.temp }}/aviso.md
        run: |
          [ -s "$AVISO" ] || exit 0
          gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body-file "$AVISO"

      - name: Salvar o que foi publicado
        if: always()
        run: |
          [ -f publicacao/publicados.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publicacao/publicados.json
          git diff --cached --quiet && exit 0
          git commit -m "Registra posts publicados no Instagram"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
